name: Supabase CI
on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La integración GitHub de Supabase aplica las migraciones al llegar a develop.
      - run: npm run migrations:check
        env:
          MIGRATIONS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm test
      - run: npm run build
