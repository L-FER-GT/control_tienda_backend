# Supabase CLI local. La integración GitHub solo lleva a producción las migraciones y los
# buckets/Edge Functions declarados aquí; [api] y [auth] se ignoran y se configuran en el panel.
# El bucket media lo crea una migración (con sus políticas): no declararlo también aquí.
project_id = "control-tienda"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["controltienda://auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "5MiB"
