# Actualizaciones de dependencias, siempre hacia develop.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/functions"
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
